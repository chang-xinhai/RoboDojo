[project]
name = "robodojo-isaac61-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "torch>=2.11",
    "torchvision>=0.26.0",
    "torchaudio>=2.11",
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "psutil",
    "protobuf>=4.25.8,!=5.26.0",
    "hidapi>=0.14.0",
    "gymnasium>=1.2.0",
    "trimesh>=4.6.8",
    "pyglet>=2.1.6,<3",
    "einops",
    "warp-lang==1.16.0",
    "matplotlib>=3.10.3",
    "pillow>=12.3.0",
    "botocore",
    "starlette>=1.3.1",
    "omniverseclient==2.72.3",
    "filelock",
    "lazy_loader>=0.4",
    "Jinja2",
    "usd-exchange==2.3.0",
    "hf-xet>=1.4.1,<2.0.0 ; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64'",
    "tensorboard",
    "numba>=0.63.1",
    "hydra-core",
    "h5py>=3.15.0",
    "packaging",
    "rich",
    "tqdm>=4.67.1",
    "gitpython>=3.1.59",
    "newton[sim]>=1.2.0",
    "requests>=2.25.0",
    "scipy>=1.11.0",
    "coacd>=1.0.7",
    "fast-simplification>=0.1.11",
    "alphashape>=1.3.1",
    "meshio>=5.3.5",
    "pycollada>=0.9",
    "resolve-robotics-uri-py>=0.4.0",
    "open3d>=0.19.0 ; python_version < '3.13' and (sys_platform != 'linux' or platform_machine != 'aarch64')",
    "newton-usd-schemas>=0.2.0",
    "PyOpenGL-accelerate>=3.1.0",
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.15.0",
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-contrib",
    "isaaclab-experimental",
    "isaaclab-newton",
    "isaaclab-physx",
    "isaaclab-ppisp",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-visualizers",
    "isaacsim[all,extscache]==6.1.0.0",
    "omegaconf",
    "transforms3d",
    "msgpack-numpy",
    "huggingface-hub",
    "flatdict",
    "pytest",
    "ruff",
    "uv",
    "ffmpeg",
    "nvidia-curobo[cu12]",
]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.11.0",
    "mujoco-warp~=3.11.0",
    "newton[sim]==1.5.2",
    "newton-usd-schemas>=0.4.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "packaging>=20,<27",
    "warp-lang==1.16.0",
    "usd-exchange==2.3.0",
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
"isaaclab" = { path = "../../third_party/IsaacLab3/source/isaaclab", editable = true }
"isaaclab-assets" = { path = "../../third_party/IsaacLab3/source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "../../third_party/IsaacLab3/source/isaaclab_contrib", editable = true }
"isaaclab-experimental" = { path = "../../third_party/IsaacLab3/source/isaaclab_experimental", editable = true }
"isaaclab-newton" = { path = "../../third_party/IsaacLab3/source/isaaclab_newton", editable = true }
"isaaclab-physx" = { path = "../../third_party/IsaacLab3/source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "../../third_party/IsaacLab3/source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "../../third_party/IsaacLab3/source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "../../third_party/IsaacLab3/source/isaaclab_tasks", editable = true }
"isaaclab-visualizers" = { path = "../../third_party/IsaacLab3/source/isaaclab_visualizers", editable = true }
nvidia-curobo = { path = "../../third_party/curobo", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
omniverseclient = { index = "pypi-public" }
