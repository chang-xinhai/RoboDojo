decimation: 1
dt: 0.004
render_interval: 10
scene:
  num_envs: 10
  env_spacing: 7

# Base renderer state between captures. Sensor capture scopes native RGB DLAA
# and IR FXAA separately, settles each phase, then restores this caller state.
render:
  antialiasing_mode: "Off"
  rendering_mode: performance
